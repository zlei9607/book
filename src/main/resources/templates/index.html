<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>首页</title>
    <th:block th:replace="common::css"/>
    <style>
        .stat-card {
            background: #fff;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
            border-left: 4px solid #009688;
        }
        .stat-card.blue { border-left-color: #1E9FFF; }
        .stat-card.orange { border-left-color: #FFB800; }
        .stat-card.red { border-left-color: #FF5722; }
        .stat-card.green { border-left-color: #5FB878; }
        .stat-card .num { font-size: 28px; font-weight: bold; color: #333; }
        .stat-card .label { color: #999; margin-top: 6px; }
    </style>
</head>
<body>
<div class="layui-layout layui-layout-admin">
    <div th:replace="common::header"></div>
    <div th:replace="common::side"></div>
    <div class="layui-body" style="padding: 20px;">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md2">
                <div class="stat-card blue">
                    <div class="num" th:text="${bookTotal}">0</div>
                    <div class="label">图书种类</div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="stat-card green">
                    <div class="num" th:text="${availableTotal}">0</div>
                    <div class="label">可借册数</div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="stat-card">
                    <div class="num" th:text="${readerTotal}">0</div>
                    <div class="label">注册读者</div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="stat-card orange">
                    <div class="num" th:text="${borrowingTotal}">0</div>
                    <div class="label">在借中</div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="stat-card red">
                    <div class="num" th:text="${overdueTotal}">0</div>
                    <div class="label">逾期未还</div>
                </div>
            </div>
        </div>
        <div id="main" style="width: 100%; height: 420px; background: #fff; margin-top: 10px;"></div>
    </div>
    <div th:replace="common::footer"></div>
</div>
<th:block th:replace="common::js"/>
<script th:src="@{/js/echarts.js}" type="text/javascript"></script>
<script th:inline="javascript">
    var myChart = echarts.init(document.getElementById('main'));
    myChart.setOption({
        title: { text: '图书分类统计', left: 'center' },
        tooltip: { trigger: 'item' },
        legend: { orient: 'vertical', left: 'left' },
        series: [{
            type: 'pie',
            radius: '55%',
            data: [[${data}]],
            emphasis: {
                itemStyle: {
                    shadowBlur: 10,
                    shadowOffsetX: 0,
                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                }
            }
        }]
    });
</script>
</body>
</html>
